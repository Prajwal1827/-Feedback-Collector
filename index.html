<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Review Management System</title>
</head>

<body>

    <header>
        <h1>Review Management System</h1>
    </header>

    <main>

        <form>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
            <br><br>

            <label for="rating">Rating:</label>
            <input
                type="number" id="rating" name="rating" min="1"max="5" placeholder="Enter rating" required >
            <br><br>

            <label for="search">Search:</label>
            <input
                type="search" id="search" name="search" placeholder="Search reviews"
                required>

        </form>

    </main>

</body>

</html>
